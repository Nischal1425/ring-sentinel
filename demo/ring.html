<!doctype html>
<html><head><meta charset="utf-8">
<title>Ring Sentinel - the 30 second explanation</title>
<style>
/* Deliberately no CDN, no framework, no fonts fetched over the network.
   This must not be able to fail while it is being screen-recorded. */
:root{--bg:#0f1115;--card:#171a21;--line:#252a34;--ink:#e7eaf0;--dim:#8b93a3;
--hot:#ff6b6b;--warm:#ffa94d;--cool:#4dabf7;--good:#51cf66}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);height:100vh;overflow:hidden;
font:16px/1.5 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
display:flex;flex-direction:column;align-items:center;justify-content:center}
.stage{position:relative;width:960px;height:600px}
svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
/* dasharray is set per path from its own length in wire(). A fixed 600 drew
   only the first 600px of any longer link, so the far edges stopped in mid
   air - visible as a line that never reached its card. */
.edge{stroke-width:2.5;fill:none;opacity:0;
transition:opacity .5s ease, stroke-dashoffset 1.1s ease}
.edge.on{opacity:.85}
.card{position:absolute;width:210px;background:var(--card);
border:1px solid var(--line);border-radius:10px;padding:12px 14px;
transition:border-color .5s ease, box-shadow .5s ease}
.card.lit{border-color:var(--hot);box-shadow:0 0 0 1px var(--hot),0 0 26px rgba(255,107,107,.28)}
.nm{font-weight:600;font-size:13px;letter-spacing:.01em}
.pay{color:var(--good);font-size:12px;margin-top:5px;font-variant-numeric:tabular-nums}
.meta{color:var(--dim);font-size:11px;margin-top:3px;font-variant-numeric:tabular-nums;
opacity:0;transition:opacity .5s ease}
.meta.on{opacity:1}
.meta b{color:var(--warm);font-weight:600}
h1{position:absolute;top:0;left:0;right:0;text-align:center;font-size:19px;
font-weight:600;transition:opacity .4s ease}
.sub{position:absolute;top:30px;left:0;right:0;text-align:center;color:var(--dim);
font-size:13px;max-width:800px;margin:0 auto;transition:opacity .4s ease}
.verdict{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.94);
background:var(--card);border:1px solid var(--hot);border-radius:12px;
padding:20px 26px;text-align:center;opacity:0;pointer-events:none;
box-shadow:0 0 40px rgba(255,107,107,.22);transition:opacity .5s ease,transform .5s ease}
.verdict.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
/* The verdict lands in the middle of the grid, so on the last beat the cards
   and links recede to context instead of being hidden behind it. */
body.hushed .card{opacity:.3}
body.hushed .edge{opacity:.22}
.card,.edge{transition:opacity .5s ease, border-color .5s ease, box-shadow .5s ease}
.score{font-size:42px;font-weight:700;color:var(--hot);font-variant-numeric:tabular-nums}
.vlabel{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.09em}
.vline{margin-top:9px;font-size:13px;max-width:470px}
.vline b{color:var(--warm)}
.hint{position:absolute;bottom:-34px;left:0;right:0;text-align:center;
color:var(--dim);font-size:12px}
/* ?video=1 - fills a 1920x1080 frame and drops the keyboard hint. The live
   presenting version is unaffected. */
body.video .stage{transform:scale(1.55);transform-origin:center}
body.video .hint{display:none}
kbd{background:#222732;border:1px solid var(--line);border-radius:4px;
padding:1px 6px;font-size:11px;font-family:ui-monospace,Menlo,monospace}
</style></head>
<body>
<div class="stage">
  <h1 id="title"></h1>
  <div class="sub" id="sub"></div>
  <svg id="wires"><g id="e0"></g><g id="e1"></g></svg>
  <div id="cards"></div>
  <div class="verdict" id="verdict">
    <div class="vlabel" id="vlabel"></div>
    <div class="score" id="vscore"></div>
    <div class="vline" id="vline"></div>
  </div>
  <div class="hint">press <kbd>space</kbd> to advance &nbsp;·&nbsp; <kbd>R</kbd> to restart</div>
</div>

<!-- RING-DATA-START : generated by demo/build_frames.py from the live
     pipeline. Every name, day, amount, edge and number below is read out of
     data/ + the detector's own reasons. Do not hand-edit; rerun the builder. -->
<script id="ringdata">
window.RING = {"id": "R0007", "score": 98, "members": [{"n": "LAXMI GARMENTS", "d": -142, "p": "Rs 29,919.86", "x": 40, "y": 105}, {"n": "STAR STORES", "d": -80, "p": "Rs 33,169.72", "x": 375, "y": 105}, {"n": "LAXMI HARDWARE", "d": -78, "p": "Rs 39,449.31", "x": 710, "y": 105}, {"n": "LAXMI TRADERS", "d": -78, "p": "Rs 32,117.94", "x": 40, "y": 280}, {"n": "ROYAL AGENCIES", "d": -76, "p": "Rs 35,965.22", "x": 375, "y": 280}, {"n": "GOLDEN TRADERS", "d": -75, "p": "Rs 31,638.14", "x": 710, "y": 280}, {"n": "VENKAT STORES", "d": -75, "p": "Rs 38,120.76", "x": 40, "y": 455}, {"n": "UNITY HARDWARE", "d": -73, "p": "Rs 30,990.14", "x": 375, "y": 455}, {"n": "ANAND FOODS", "d": -80, "p": "Rs 36,698.50", "x": 710, "y": 455}], "steps": [{"title": "Nine merchants. Every payment is an ordinary sale.", "sub": "Razorpay's per-payment model clears all of them. Correctly."}, {"title": "Three of them sign in from one device.", "sub": "Fingerprint FP0158724809. Three separate businesses, one machine.", "edges": [[0, 1], [0, 5], [1, 5]], "colour": "#ff6b6b"}, {"title": "Three of them share a settlement account.", "sub": "A marketplace shares an internet address with its sellers. It does not put them on its own settlement account.", "edges": [[0, 4], [0, 8], [4, 8]], "colour": "#4dabf7"}, {"title": "All nine accounts were opened within 69 days.", "sub": "Chance predicts 1188 days for nine accounts picked at random from this book.", "meta": true}, {"title": "", "sub": "", "verdict": true}], "verdict": {"label": "Ring R0007", "line": "Refunds run 10.0x the portfolio rate (53 of 129 payments, lower-bound estimate)"}};
</script>
<!-- RING-DATA-END -->

<script>
const R = window.RING, M = R.members, CW = 210, CH = 78;

const cards = document.getElementById("cards");
M.forEach((m, i) => {
  const el = document.createElement("div");
  el.className = "card";
  el.style.left = m.x + "px";
  el.style.top = m.y + "px";
  el.id = "c" + i;
  el.innerHTML = `<div class="nm">${m.n}</div>
    <div class="pay">${m.p} &middot; ordinary sale</div>
    <div class="meta" id="m${i}">account opened <b>day ${m.d}</b></div>`;
  cards.appendChild(el);
});

const centre = i => ({x: M[i].x + CW / 2, y: M[i].y + CH / 2});
function wire(group, i, j, colour, bow) {
  // Two relations can join the SAME pair, so straight lines put one exactly on
  // top of the other and the first became invisible. Bow them apart instead.
  const a = centre(i), b = centre(j);
  const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
  const dx = b.x - a.x, dy = b.y - a.y;
  const len = Math.hypot(dx, dy) || 1;
  const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
  p.setAttribute("d", `M${a.x},${a.y} Q${mx + (-dy / len) * bow},${my + (dx / len) * bow} ${b.x},${b.y}`);
  p.setAttribute("stroke", colour);
  p.setAttribute("class", "edge");
  document.getElementById(group).appendChild(p);
  const len2 = p.getTotalLength();
  p.style.strokeDasharray = len2;
  p.style.strokeDashoffset = len2;
  return p;
}

const T = document.getElementById("title"), S = document.getElementById("sub");
// Each step owns the edges it draws, so a step is replayable from ?step=N.
const drawn = R.steps.map((st, k) => (st.edges || []).map(
  e => wire("e" + (k % 2), e[0], e[1], st.colour || "#ff6b6b", (k % 2) ? -26 : 26)));

function apply(k) {
  const st = R.steps[k];
  T.textContent = st.title; S.textContent = st.sub;
  drawn[k].forEach(p => { p.classList.add("on"); p.style.strokeDashoffset = 0; });
  if (st.meta) M.forEach((_, i) => document.getElementById("m" + i).classList.add("on"));
  if (st.verdict) {
    T.style.opacity = 0; S.style.opacity = 0;
    M.forEach((_, i) => document.getElementById("c" + i).classList.add("lit"));
    document.body.classList.add("hushed");
    document.getElementById("vlabel").textContent = R.verdict.label;
    document.getElementById("vscore").textContent = R.score;
    document.getElementById("vline").innerHTML = R.verdict.line;
    document.getElementById("verdict").classList.add("on");
  }
}

let at = 0;
apply(0);
function advance() { if (at < R.steps.length - 1) apply(++at); }

// ?step=N jumps straight to a state so Chrome can screenshot it; ?video=1
// scales the stage to fill a 1080p frame. Both are for the rendered video
// only - pressing space still works exactly as before.
const Q = new URLSearchParams(location.search);
if (Q.get("video")) document.body.classList.add("video");
const want = parseInt(Q.get("step") || "0", 10);
for (let k = 0; k < want; k++) advance();
addEventListener("keydown", e => {
  if (e.code === "Space" || e.code === "ArrowRight") { e.preventDefault(); advance(); }
  if (e.key === "r" || e.key === "R") location.reload();
});
addEventListener("click", advance);
</script>
</body></html>
